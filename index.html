<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Путь стоматолога</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one narrow column — sticky HUD, scene card, journal. Palette: enamel, Neva granite, teal of a clinic, gold of the dream board. */
:root{
  --bg:#ECF0F1; --surface:#FFFFFF; --surface-2:#F4F7F7; --ink:#13202A; --muted:#566673; --line:#D3DCE0;
  --accent:#0E6F6A; --accent-ink:#FFFFFF; --accent-soft:#D7ECEA;
  --gold:#8E6C22; --gold-soft:#F3EAD6;
  --ok:#2E7D4F; --bad:#B23B2C; --bad-soft:#F7E1DD;
  --tooth:#FBFAF5; --tooth-line:#93A3AE; --gum:#F1CACA; --decay:#3B2A22; --fill:#B4BFC7; --crown:#E2C77E; --stain:#EAD9A2; --blood:#C0453A;
  --f-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0E10; --surface:#14191D; --surface-2:#1B2227; --ink:#E6ECEE; --muted:#93A1AB; --line:#29343C;
    --accent:#43C2B5; --accent-ink:#06201E; --accent-soft:#163533;
    --gold:#D8B566; --gold-soft:#2C2616;
    --ok:#62C48A; --bad:#E77462; --bad-soft:#3A1E1A;
    --tooth:#E9E5DA; --tooth-line:#6D7C86; --gum:#5A3036; --decay:#2A1A14; --fill:#8E99A1; --crown:#C9A85A; --stain:#CDB977; --blood:#E06253;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0E10; --surface:#14191D; --surface-2:#1B2227; --ink:#E6ECEE; --muted:#93A1AB; --line:#29343C;
  --accent:#43C2B5; --accent-ink:#06201E; --accent-soft:#163533;
  --gold:#D8B566; --gold-soft:#2C2616;
  --ok:#62C48A; --bad:#E77462; --bad-soft:#3A1E1A;
  --tooth:#E9E5DA; --tooth-line:#6D7C86; --gum:#5A3036; --decay:#2A1A14; --fill:#8E99A1; --crown:#C9A85A; --stain:#CDB977; --blood:#E06253;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 40px}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:18px}
.hud-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.who{min-width:0}
.who b{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.01em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font:500 12px/1 var(--f-mono);font-variant-numeric:tabular-nums;padding:6px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.chip i{font-style:normal;color:var(--muted);margin-right:4px}
.chip.neg{color:var(--bad);border-color:var(--bad)}
.energy{display:flex;align-items:center;gap:8px;margin-top:8px;font:500 12px var(--f-mono);color:var(--muted)}
.energy .track{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.energy .track span{display:block;height:100%;background:var(--accent);transition:width .3s}
.energy.low .track span{background:var(--bad)}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.ghost:hover{border-color:var(--accent);color:var(--accent)}
.ghost.gold{border-color:var(--gold);color:var(--gold)}

/* Scene typography */
.eyebrow{font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,7vw,44px);line-height:1.05;margin:0 0 10px;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:500;font-size:20px;line-height:1.2;margin:0 0 8px;text-wrap:balance}
h3{font:700 13px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.lead{color:var(--muted);margin:0 0 16px;max-width:60ch}
p{margin:0 0 12px}
.scene{display:flex;flex-direction:column}

/* Skill bars */
.skills{display:grid;gap:8px;margin:6px 0 4px}
.skill{display:grid;grid-template-columns:96px 1fr 38px;align-items:center;gap:10px;font-size:14px}
.skill .track{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.skill .track span{display:block;height:100%;background:var(--accent)}
.skill.gold .track span{background:var(--gold)}
.skill b{font:700 13px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}

/* Planner */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slots.two{grid-template-columns:repeat(2,1fr)}
.slot{min-height:52px;border:1.5px dashed var(--line);border-radius:12px;background:none;font-size:13px;font-weight:700;padding:8px;cursor:pointer;color:var(--muted);line-height:1.25}
.slot.filled{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.slot:disabled{cursor:default}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;min-width:0}
.act:hover:not(:disabled){border-color:var(--accent)}
.act:disabled{opacity:.45;cursor:not-allowed}
.act.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.act-t{font-weight:700;font-size:15px;line-height:1.25}
.act-d{font-size:13px;color:var(--muted);line-height:1.35}
.act-e{font:500 11px var(--f-mono);color:var(--bad);margin-top:4px}
.act-e.pos{color:var(--ok)}
.act-e.money{color:var(--gold)}
.primary{margin-top:16px;width:100%;padding:15px 18px;border-radius:var(--r);border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;cursor:pointer}
.primary:disabled{opacity:.4;cursor:not-allowed}
.secondary{margin-top:8px;width:100%;padding:13px 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.opts{display:grid;gap:8px;margin-top:8px}
.opt{text-align:left;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:15px;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{opacity:.5;cursor:default}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.note{padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:14px;margin-top:10px}
.note.good{border-color:var(--ok)}
.note.bad{border-color:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}

/* Intro */
.intro h1{font-size:clamp(34px,10vw,64px)}
.intro .road{display:grid;gap:0;margin:18px 0 6px;border-left:2px solid var(--accent);padding-left:14px}
.intro .road div{padding:6px 0;font-size:15px}
.intro .road b{font:700 11px var(--f-mono);color:var(--accent);letter-spacing:.1em;display:block}
label.field{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-top:14px}
input[type=text]{width:100%;margin-top:6px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 17px var(--f-body)}

/* Exam results */
table.res{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.res td{padding:10px 0;border-bottom:1px solid var(--line)}
table.res td:last-child{text-align:right;font:700 18px var(--f-mono)}
table.res tr.total td{border-bottom:0;font-weight:700}
table.res tr.total td:last-child{font-size:26px;color:var(--accent)}

/* Clinic case */
.patient{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ava{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font:700 16px var(--f-display);background:var(--accent-soft);color:var(--accent);flex:none}
.patient b{display:block;font-size:17px}
.patient span{color:var(--muted);font-size:13px}
.steps{display:flex;gap:4px;margin:4px 0 14px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.done{background:var(--accent)}
.chat{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.45}
.msg.p{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
.msg.d{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px;align-self:flex-end}
.msg.n{align-self:center;max-width:100%;background:none;color:var(--muted);font-size:13px;text-align:center;padding:2px 8px}
.msg.f{align-self:stretch;max-width:100%;background:var(--surface-2);border:1px dashed var(--tooth-line);font-size:14px;border-radius:10px}
.msg.f b{font:700 11px var(--f-mono);letter-spacing:.08em;color:var(--muted);display:block;margin-bottom:2px}
.chart-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 8px 6px;overflow-x:auto}
svg.chart{display:block;width:100%;min-width:320px;height:auto}
.chart text{font:500 10px var(--f-mono);fill:var(--muted)}
.chart .gum{fill:var(--gum)}
.chart .tb{fill:var(--tooth);stroke:var(--tooth-line);stroke-width:1.2}
.chart .tb.miss{fill:none;stroke-dasharray:3 3}
.chart .tb.crown{fill:var(--crown)}
.chart .tb.stain{fill:var(--stain)}
.chart .decay{fill:var(--decay)}
.chart .fl{fill:var(--fill)}
.chart .blood{fill:var(--blood);opacity:.75}
.chart g.click{cursor:pointer}
.chart g.click:hover .tb,.chart g.click:focus .tb{stroke:var(--accent);stroke-width:2.4}
.chart g.wrong .tb{stroke:var(--bad);stroke-width:2.4}
.chart g.right .tb{stroke:var(--ok);stroke-width:3}
.chart g.right text,.chart g.wrong text{font-weight:700}
.chart g:focus{outline:none}
.legend{font-size:12px;color:var(--muted);margin:6px 4px 0}
.stars{font:700 28px var(--f-mono);color:var(--gold);letter-spacing:.1em}
ul.check{list-style:none;padding:0;margin:8px 0;display:grid;gap:6px}
ul.check li{display:grid;grid-template-columns:22px 1fr;gap:6px;font-size:15px}
ul.check li::before{content:"✓";font:700 15px var(--f-mono);color:var(--ok)}
ul.check li.no::before{content:"✗";color:var(--bad)}
ul.check li.half::before{content:"~";color:var(--gold)}

/* Hub */
.status{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:4px 0 6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat i{font-style:normal;display:block;font-size:12px;color:var(--muted)}
.stat b{font:700 16px var(--f-mono);font-variant-numeric:tabular-nums}

/* Journal */
.journal{margin-top:28px}
.journal ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.journal li{font-size:14px;color:var(--muted);padding-left:14px;position:relative}
.journal li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--line)}
.journal li:first-child{color:var(--ink)}
.journal li:first-child::before{background:var(--accent)}
.journal li.g::before{background:var(--gold)}
.journal li.b::before{background:var(--bad)}

/* Dream board sheet */
.sheet{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--bg) 60%,transparent);backdrop-filter:blur(6px);display:flex;justify-content:center;align-items:flex-end}
.sheet-in{background:var(--surface);width:100%;max-width:720px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;border:1px solid var(--line);padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.dreams{display:grid;gap:8px;margin-top:10px}
.dream{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}
.dream .mk{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--tooth-line);display:grid;place-items:center;font:700 13px var(--f-mono)}
.dream.done{border-color:var(--gold);background:var(--gold-soft)}
.dream.done .mk{background:var(--gold);border-color:var(--gold);color:var(--surface)}
.dream b{display:block;font-size:15px;line-height:1.3}
.dream small{color:var(--muted);font-size:12px}
.dream .buy{border:1px solid var(--gold);color:var(--gold);background:none;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.dream .buy:disabled{opacity:.4;cursor:not-allowed}
.stamps{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.stamp{font:700 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border:1.5px solid var(--gold);color:var(--gold);border-radius:6px;transform:rotate(-2deg)}
.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.foot .ghost{font-size:12px}
@media (max-width:380px){.acts{grid-template-columns:1fr}.status{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fade{animation:fade .35s ease-out}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hud" id="hud"></header>
  <main id="screen" class="scene"></main>
  <section class="journal" id="journal"></section>
  <footer class="foot" id="foot"></footer>
</div>
<div class="sheet" id="sheet" hidden></div>

<script>
'use strict';
/* ===================== utils ===================== */
const KEY = 'stomat-path-v1';
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = n => Math.round(n).toLocaleString('ru-RU');
const rub = n => fmt(n) + ' ₽';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const years = n => { const a = n % 10, b = n % 100; return n + ' ' + (a === 1 && b !== 11 ? 'год' : (a >= 2 && a <= 4 && (b < 12 || b > 14) ? 'года' : 'лет')); };
const pickOne = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(x => x[1]);

let S = null;
let ui = { sheet: false, confirmReset: false, tripMenu: false, lastScene: null };

function fresh(name) {
  return {
    v: 1, name: name || 'Я', scene: 'school', ageBase: 17,
    month: 0, picks: [], usedEv: [], ev: null, gapYear: false,
    st: { chem: 42, bio: 50, rus: 58, energy: 80, id: 0 },
    tiktok: 120, tg: 0, tgOn: false, money: 5000,
    ege: null, admit: null, target: 0,
    uni: { year: 1, know: 20, hands: 5, surg: 0, sno: false, picks: [], quizDone: false, quizPick: null },
    accred: null, path: null, resid: 0, residDone: false,
    courses: { implant: false, sinus: false },
    day: 0, rep: 0, skill: 0, clinics: 0, mentees: 0, style: 0, contentToday: false,
    trips: [], car: null, house: false, finaleSeen: false,
    cs: null, lastCase: null, log: []
  };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function load() { try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function log(m, k) { S.log.unshift({ m, k: k || '' }); S.log = S.log.slice(0, 8); }
function age() {
  if (S.scene === 'school' || S.scene === 'event' && S.ev && S.ev.next === 'school' || S.scene === 'ege') return S.ageBase;
  if (!S.path) return S.ageBase + (S.uni ? S.uni.year : 1);
  return S.ageBase + 6 + Math.floor(S.day / 40);
}

/* ===================== shared mechanics ===================== */
function gain(key, base) {
  const eff = S.st.energy < 25 ? 0.5 : 1;
  const inc = Math.max(0.6, base * eff * (1 - S.st[key] / 125) + rnd(-1, 1.5));
  S.st[key] = clamp(S.st[key] + inc, 0, 100);
  return inc;
}
function post(mult) {
  let g = ri(40, 220) * (mult || 1) * (1 + S.style * 0.15) * (1 + Math.log10(1 + S.tiktok) / 4);
  const viral = Math.random() < 0.1;
  if (viral) g *= ri(12, 30);
  g = Math.round(g);
  S.tiktok += g;
  if (S.tgOn) S.tg += Math.round(g * 0.12);
  log(viral ? `Видео залетело в рекомендации: +${fmt(g)} подписчиков в TikTok` : `Новое видео: +${fmt(g)} подписчиков`, viral ? 'g' : '');
  return g;
}
function addTrip(place) {
  if (!S.trips.includes(place)) S.trips.push(place);
}

/* ===================== Chapter 1: 11th grade ===================== */
const MONTHS = ['Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь', 'Январь', 'Февраль', 'Март', 'Апрель', 'Май'];
const BUDGET_PASS = 275;
const SCHOOL_ACTS = [
  { id: 'chem', t: 'Курсы по химии', d: 'Органика, задачи 33–34', e: -14, run: () => { const g = gain('chem', 12); return `Химия +${g.toFixed(1)}`; } },
  { id: 'bio', t: 'Биология', d: 'Генетика, анатомия человека', e: -13, run: () => { const g = gain('bio', 12); return `Биология +${g.toFixed(1)}`; } },
  { id: 'rus', t: 'Русский', d: 'Сочинение, задание 27', e: -11, run: () => { const g = gain('rus', 11); return `Русский +${g.toFixed(1)}`; } },
  { id: 'mock', t: 'Пробник ЕГЭ', d: 'Прогноз баллов и опыт экзамена', e: -16, run: () => {
      ['chem', 'bio', 'rus'].forEach(k => S.st[k] = clamp(S.st[k] + 2, 0, 100));
      const f = k => clamp(Math.round(S.st[k] + 3), 0, 100);
      return `Пробник: химия ≈${f('chem')}, биология ≈${f('bio')}, русский ≈${f('rus')}. Сумма ≈${f('chem') + f('bio') + f('rus')}`;
    } },
  { id: 'tt', t: 'Снять TikTok', d: 'Будни будущего стоматолога', e: -6, run: () => { post(1); return null; } },
  { id: 'rest', t: 'Выспаться', d: 'Сон, прогулка, сериал', e: 30, run: () => null }
];
const SCHOOL_EVENTS = {
  essay: { t: 'Итоговое сочинение', x: 'Первая среда декабря. Итоговое сочинение — допуск к ЕГЭ. Одна из тем про выбор жизненного пути.', o: [
    { l: 'Написать про мечту стать хирургом-стоматологом', r: () => { if (S.st.rus >= 45 || Math.random() < 0.85) { S.st.rus += 2; return 'Зачёт! Допуск к ЕГЭ получен. Русский +2.'; } S.st.energy -= 10; return 'Незачёт. Пересдача в феврале, уже зачёт. Нервы потрачены: энергия −10.'; } },
    { l: 'Взять надёжный аргумент из «Войны и мира»', r: () => { S.st.rus += 1; return 'Зачёт. Скучно, но надёжно.'; } }] },

function bar(label, v, gold) {

}
function endMonth() {
  const notes = [];
  S.picks.forEach(id => {
    const a = SCHOOL_ACTS.find(x => x.id === id);
    S.st.energy = clamp(S.st.energy + a.e, 0, 100);
    const r = a.run();
    if (r) notes.push(r);
  });
  S.st.energy = clamp(S.st.energy + 6, 0, 100);
  notes.forEach(n => log(n));
  S.picks = [];
  // pick event
  let id = null;
  if (S.month === 3) id = 'essay';
  else if (S.st.energy < 25 && !S.usedEv.includes('burn')) id = 'burn';
  else {
    const pool = Object.keys(SCHOOL_EVENTS).filter(k => k !== 'essay' && !S.usedEv.includes(k));
    if (pool.length) id = pickOne(pool);
  }
  if (id === 'essay' && S.gapYear) id = null;
  if (id) { S.usedEv.push(id); S.ev = { set: 'school', id, next: 'school', res: null }; S.scene = 'event'; }
  else afterSchoolMonth();
}
function afterSchoolMonth() {

/* EGE */
function calcEge() {
  const sc = k => clamp(Math.round(S.st[k] + 3 + rnd(-4, 4)), 20, 100);
  const chem = sc('chem'), bio = sc('bio'), rus = sc('rus');
  let id = S.st.id;
  const honors = S.st.chem >= 80 && S.st.bio >= 80 && S.st.rus >= 80;
  if (honors) id = Math.min(10, id + 5);
  S.ege = { chem, bio, rus, id, honors, total: chem + bio + rus + id };
}
function scEge() {
  const e = S.ege, pass = e.total >= BUDGET_PASS, target = e.total >= 250;
  return `<p class="eyebrow">Июнь · ЕГЭ</p><h1>${pass ? 'Бюджет!' : 'Результаты ЕГЭ'}</h1>
    <div class="panel"><table class="res">

function egeChoice(v) {

function startPractice(path) {
  if (path === 'surg') enterResid(); else { S.path = 'gp'; log('Первый рабочий день стоматологом общей практики.', 'g'); }

}
function enterResid() {
  const b = S.path === 'gp' ? S.rep >= 20 : residBudget();
  if (!b) { S.money -= 1200000; log('Ординатура на платной основе: −1 200 000 ₽.', 'b'); }

}

function caseAvailable(c) {
  if (c.need === 'gp') return true;

function title() {
  if (S.path === 'surg') {

    return S.courses.implant ? 'Стоматолог-хирург, имплантолог' : 'Стоматолог-хирург';
  }

}

const STEPS = ['greet', 'ask', 'exam', 'img', 'dx', 'plan', 'done'];

  const c = (fresh_.length && Math.random() < 0.55) ? pickOne(fresh_) : pickOne(opts.length ? opts : pool);
  S.lastCase = c.id;
  S.cs = { id: c.id, step: 'greet', tone: null, asked: [], wrong: [], found: false, img: null, dx: null, plan: null, order: { dx: shuffle(c.dx.map((_, i) => i)), plan: shuffle(c.plan.map((_, i) => i)) }, chat: [{ w: 'p', t: c.c }], result: null };

function finishCase() {

  const toneOk = st.tone === c.tone;
  add(toneOk ? 'y' : 'n', toneOk ? 'Тон разговора попал в пациента' : 'Тон разговора не подошёл этому пациенту', toneOk ? 1 : 0);
  add(keysOk ? 'y' : 'n', keysOk ? 'Ключевые вопросы анамнеза заданы' : 'Пропущен важный вопрос анамнеза: «' + c.q[keys.find(i => !st.asked.includes(i))].q + '»', keysOk ? 1 : 0);
  add(st.wrong.length === 0 ? 'y' : 'h', st.wrong.length === 0 ? `Зуб ${st.foundId} найден с первого раза` : `Зуб ${st.foundId} найден с ${st.wrong.length + 1}-й попытки`, st.wrong.length === 0 ? 1 : 0.5);
  const imgOk = c.img.ok.includes(st.img), imgHalf = c.img.half.includes(st.img);
  add(imgOk ? 'y' : (imgHalf ? 'h' : 'n'), imgOk ? `Исследование выбрано верно: ${IMG[st.img].toLowerCase()}` : (imgHalf ? `${IMG[st.img]} — допустимо, но не оптимально` : `${IMG[st.img]} — неудачный выбор`), imgOk ? 1 : (imgHalf ? 0.5 : 0));
  const dxOk = st.dx === c.dxc, planOk = st.plan === c.pc;
  add(dxOk ? 'y' : 'n', dxOk ? 'Диагноз верный' : 'Диагноз неверный. Правильно: ' + c.dx[c.dxc], dxOk ? 1 : 0);
  add(planOk ? 'y' : 'n', planOk ? 'План лечения верный' : 'План лечения неверный. Правильно: ' + c.plan[c.pc], planOk ? 1 : 0);

  if (!planOk) stars = Math.min(stars, 2);
  if (c.fearful && st.tone === 'joke') stars = Math.max(1, stars - 1);
  let complication = null;
  if (c.risk && !keysOk) { stars = Math.max(1, stars - 2); complication = c.risk; }
  const income = Math.round((c.fee * stars / 5 + routine()) * priceMult());
  const dRep = { 1: -4, 2: -2, 3: 1, 4: 2, 5: 4 }[stars];

}

/* tooth chart (FDI) */
const TW = { 1: 24, 2: 22, 3: 24, 4: 27, 5: 27, 6: 36, 7: 34, 8: 32 };
function chart(states, clickable) {
  const upper = [18, 17, 16, 15, 14, 13, 12, 11, 21, 22, 23, 24, 25, 26, 27, 28];
  const lower = [48, 47, 46, 45, 44, 43, 42, 41, 31, 32, 33, 34, 35, 36, 37, 38];
  let out = '<rect class="gum" x="6" y="14" width="532" height="26" rx="13"/><rect class="gum" x="6" y="166" width="532" height="26" rx="13"/>';
  const row = (ids, y, up) => {
    let x = 10;
    ids.forEach((id, i) => { if (i === 8) x += 8; const w = TW[id % 10]; out += toothSvg(id, x, y, w, up, states[id] || 'ok', clickable); x += w + 4; });
  };
  row(upper, 22, true); row(lower, 122, false);
  return `<svg class="chart" viewBox="0 0 544 206" role="group" aria-label="Зубная формула">${out}</svg>`;
}
function toothSvg(id, x, y, w, up, state, clickable) {
  const h = 62, rx = w * 0.32, cx = x + w / 2, cy = y + h / 2;
  const occ = up ? y + h - 15 : y + 15;
  const st = S.cs || { wrong: [] };
  const mark = st.wrong.includes(id) ? 'wrong' : (st.found && st.foundId === id ? 'right' : '');
  let body = '';
  if (state === 'missing' || state === 'socket') {
    body = `<rect class="tb miss" x="${x + 2}" y="${y + 6}" width="${w - 4}" height="${h - 12}" rx="${rx}"/>`;
    if (state === 'socket') body += `<ellipse class="blood" cx="${cx}" cy="${cy}" rx="${w * 0.25}" ry="10"/>`;
  } else if (state === 'impacted') {
    const dy = up ? -12 : 12, rot = up ? 18 : -28;
    body = `<g transform="translate(0 ${dy}) rotate(${rot} ${cx} ${cy})"><rect class="tb" x="${x + 2}" y="${y + 4}" width="${w - 4}" height="${h - 8}" rx="${rx}"/></g>`;
  } else {
    const cls = state === 'crown' ? 'crown' : (state === 'stain' ? 'stain' : '');
    body = `<rect class="tb ${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}"/>`;
    if (state === 'caries') body += `<circle class="decay" cx="${cx + w * 0.08}" cy="${occ}" r="${Math.max(4, w * 0.17)}"/>`;
    if (state === 'filling') body += `<rect class="fl" x="${cx - w * 0.25}" y="${occ - 6}" width="${w * 0.5}" height="12" rx="3"/>`;
    if (state === 'destroyed') {
      const e = up ? y + h : y, s = up ? -1 : 1, d = v => e + s * v;
      body += `<polygon class="decay" points="${x},${d(0)} ${x + w},${d(0)} ${x + w},${d(22)} ${x + w * 0.8},${d(12)} ${x + w * 0.6},${d(26)} ${x + w * 0.4},${d(10)} ${x + w * 0.2},${d(24)} ${x},${d(14)}"/>`;
    }
  }
  const ty = up ? 10 : 203;
  const attrs = clickable ? `class="click ${mark}" data-a="tooth" data-v="${id}" tabindex="0" role="button" aria-label="Зуб ${id}"` : `class="${mark}"`;
  return `<g ${attrs}>${body}<rect x="${x}" y="${y - 6}" width="${w}" height="${h + 12}" fill="transparent"/><text x="${cx}" y="${ty}" text-anchor="middle">${id}</text></g>`;
}

  const row = d => {
    let btn = '';
    if (d.buy === 'car' && !d.ok) btn = `<span style="display:flex;gap:4px"><button class="buy" data-a="buyCar" data-v="black" ${canBuy && S.money >= CAR_PRICE ? '' : 'disabled'}>Чёрный</button><button class="buy" data-a="buyCar" data-v="white" ${canBuy && S.money >= CAR_PRICE ? '' : 'disabled'}>Белый</button></span>`;
    if (d.buy === 'house' && !d.ok) btn = `<button class="buy" data-a="buyHouse" ${canBuy && S.money >= HOUSE_PRICE ? '' : 'disabled'}>Купить</button>`;
    return `<div class="dream ${d.ok ? 'done' : ''}"><span class="mk">${d.ok ? '✓' : ''}</span><div><b>${d.t}</b><small>${d.s}</small></div>${btn || '<span></span>'}</div>`;
  };
  return `<div class="sheet-in" role="dialog" aria-modal="true" aria-label="Доска мечт">
    <div class="sheet-head"><h2>Доска мечт · ${done} из ${D.length}</h2><button class="ghost" data-a="closeSheet">Закрыть</button></div>
    <p class="lead" style="margin-bottom:6px">${esc(S.name)}, ${years(age())} · ${S.path ? title() : (S.scene === 'school' || S.scene === 'ege' ? 'школьник, 11 класс' : 'студент ПСПбГМУ')}</p>
    ${S.trips.length ? `<div class="stamps">${S.trips.map(t => `<span class="stamp">${esc(t)}</span>`).join('')}</div>` : ''}
    <div class="dreams">${D.map(row).join('')}</div>
    ${!canBuy ? '<p class="legend" style="margin-top:10px">Покупки откроются, когда начнётся практика.</p>' : ''}
  </div>`;
}
function scFinale() {
  return `<p class="eyebrow">Финал · ${years(age())}</p><h1>Всё сбылось</h1>
    <p class="lead">${esc(S.name)} — ${title().toLowerCase()}, владелец сети из ${S.clinics} клиник, наставник для ${S.mentees} молодых врачей. ${fmt(S.tiktok)} подписчиков в TikTok, ${fmt(S.tg)} в Telegram. ${S.car === 'white' ? 'Белый' : 'Чёрный'} GLS 63 у дома на берегу реки, штампы: ${S.trips.join(', ')}.</p>
    <p class="lead">Это игра, а настоящий путь начинается с ближайшего пробника по химии.</p>
    <button class="primary" data-a="finaleGo">Продолжить практику</button>`;
}

/* ===================== render ===================== */
const SCENES = { intro: scIntro, school: scSchool, event: scEvent, ege: scEge, uni: scUni, accred: scAccred, resid: scResid, hub: scHub, case: scCase, finale: scFinale };
function scIntro() {
  return `<div class="intro fade"><p class="eyebrow">Симулятор жизни · Санкт-Петербург</p>
    <h1>Путь стоматолога</h1>
    <p class="lead">От 11 класса до своей сети клиник. Готовишься к ЕГЭ, поступаешь в Павлова, учишься, лечишь пациентов, растишь TikTok и закрываешь пункты на доске мечт.</p>
    <div class="road">
      <div><b>ГЛАВА 1</b>11 класс: химия, биология, русский, TikTok и ЕГЭ</div>
      <div><b>ГЛАВА 2</b>ПСПбГМУ им. Павлова: пять курсов, СНО, сессии</div>
      <div><b>ГЛАВА 3</b>Практика: диалоги с пациентами, зубная формула, диагнозы</div>
      <div><b>ФИНАЛ</b>Сеть клиник, ученики, путешествия, GLS 63 и дом у реки</div>
    </div>
    <label class="field" for="nm">Как тебя зовут в игре?</label>
    <input type="text" id="nm" maxlength="24" placeholder="Например, Саша" autocomplete="off">
    <button class="primary" data-a="start">Начать с сентября</button></div>`;
}
function hud() {
  if (S.scene === 'intro') return `<div class="hud-top"><div class="who"><b>Путь стоматолога</b><span>новая игра</span></div></div>`;
  const chapter = S.path ? 'Практика' : (['uni', 'accred', 'resid'].includes(S.scene) || S.ev && S.ev.set === 'uni' && S.scene === 'event' ? 'Университет' : 'Школа');
  const showEnergy = S.path || ['school', 'ege'].includes(S.scene) || (S.scene === 'event' && S.ev && S.ev.set === 'school');
  const e = Math.round(S.st.energy);
  const chips = [
    `<span class="chip ${S.money < 0 ? 'neg' : ''}"><i>₽</i>${fmt(S.money)}</span>`,
    `<span class="chip"><i>TikTok</i>${fmt(S.tiktok)}</span>`,
    S.tgOn ? `<span class="chip"><i>TG</i>${fmt(S.tg)}</span>` : '',
    S.path ? `<span class="chip"><i>Реп.</i>${Math.round(S.rep)}</span>` : ''
  ].join('');
  return `<div class="hud-top"><div class="who"><b>${esc(S.name)}, ${age()}</b><span>${chapter}</span></div>
    <button class="ghost gold" data-a="openSheet">Мечты ${dreams().filter(d => d.ok).length}/14</button></div>
    <div class="chips">${chips}</div>
    ${showEnergy ? `<div class="energy ${e < 25 ? 'low' : ''}"><span>Энергия</span><div class="track"><span style="width:${e}%"></span></div><span>${e}</span></div>` : ''}`;
}
function render() {
  $('#hud').innerHTML = hud();
  $('#screen').innerHTML = (SCENES[S.scene] || scIntro)();
  $('#journal').innerHTML = S.log.length ? `<h3>Дневник</h3><ol>${S.log.map(l => `<li class="${l.k}">${esc(l.m)}</li>`).join('')}</ol>` : '';
  $('#foot').innerHTML = ui.confirmReset
    ? `<span>Стереть прогресс и начать заново?</span><span style="display:flex;gap:6px"><button class="ghost" data-a="resetYes">Да, заново</button><button class="ghost" data-a="resetNo">Отмена</button></span>`
    : `<span>Игра упрощает медицину и не заменяет консультацию врача.</span>${S.scene !== 'intro' ? '<button class="ghost" data-a="reset">Начать заново</button>' : ''}`;
  const sh = $('#sheet');
  sh.hidden = !ui.sheet;
  sh.innerHTML = ui.sheet ? sheetView() : '';
  const key = S.scene + (S.scene === 'uni' ? S.uni.year : '') + (S.scene === 'school' ? S.month : '') + (ui.tripMenu ? 't' : '');
  if (key !== ui.lastScene) { window.scrollTo(0, 0); ui.lastScene = key; }
}

/* ===================== handlers ===================== */
const H = {
  start: () => { const n = ($('#nm').value || '').trim(); S = fresh(n || 'Я'); log('Сентябрь, 11 класс. Цель — стоматология в Павлова на бюджете.'); },
  pick: v => { if (S.picks.length < 3) S.picks.push(v); },
  unpick: v => { S.picks.splice(+v, 1); },
  endMonth: () => { if (S.picks.length === 3) endMonth(); },
  evPick: v => { const ev = EVENT_SETS[S.ev.set][S.ev.id]; if (S.ev.res) return; const r = ev.o[+v].r(); S.st.energy = clamp(S.st.energy, 0, 100); S.ev.res = r; log(r); },
  evNext: () => { const next = S.ev.set; S.ev = null; if (next === 'school') afterSchoolMonth(); else afterUniYear(); },
  ege: v => egeChoice(v),
  uniPick: v => { const p = S.uni.picks; const i = p.indexOf(v); if (i >= 0) p.splice(i, 1); else if (p.length < 2) p.push(v); },
  uniEnd: () => { if (S.uni.picks.length === 2) uniEnd(); },
  quiz: v => { if (S.uni.quizPick === null) quizAnswer(+v); },
  quizNext: () => quizNext(),
  accredNext: () => { if (S.accred < 50) { S.accred = clamp(S.accred + 15 + ri(0, 10), 50, 100); S.uni.hands += 5; log('Месяц тренировок на фантомах — и пересдача.'); return; } log('Диплом врача-стоматолога получен!', 'g'); S.scene = 'resid'; },
  resid: v => startPractice(v),
  case: () => { if (S.st.energy >= 18) startCase(); },
  week: () => {
    if (S.st.energy < 35) return;
    const inc = Math.round(routine() * 5 * priceMult() * 0.9);
    S.money += inc; S.st.energy = clamp(S.st.energy - 35, 0, 100); S.skill = clamp(S.skill + 1, 0, 100); S.rep = clamp(S.rep + 1, 0, 100);
    nextDay(5); log(`Неделя приёмов: +${rub(inc)}${S.clinics ? ', клиники принесли ещё ' + rub(clinicIncome() * 5) : ''}`);
  },
  content: () => {
    if (S.contentToday || S.st.energy < 8) return;
    S.contentToday = true; S.st.energy -= 8;
    post(1 + S.rep / 50 + S.clinics * 0.3);
    if (S.tgOn) { const g = ri(30, 120) + Math.round(S.rep * 3); S.tg += g; }
  },
  rest: () => { S.st.energy = clamp(S.st.energy + 40, 0, 100); nextDay(1); log('Выходной. Прогулка по набережной Невы, энергия +40.'); },
  treat: () => {
    if (S.style < 5) { const c = 150000 * (S.style + 1); if (S.money < c) return; S.money -= c; S.style++; log(`Новый образ: гардероб ${S.style} из 5.`, 'g'); }
    else { if (S.money < 60000) return; S.money -= 60000; log('Ужин в любимом ресторане.'); }
    S.st.energy = clamp(S.st.energy + 20, 0, 100);
  },
  tripMenu: () => { ui.tripMenu = true; },
  tripBack: () => { ui.tripMenu = false; },
  trip: v => {
    const t = TRIPS.find(x => x[0] === v); if (!t || S.money < t[1]) return;
    S.money -= t[1]; addTrip(v); S.st.energy = 100; nextDay(7); post(2.5 + S.style * 0.2);
    log(`${v}: неделя отдыха и тревел-влог.`, 'g'); ui.tripMenu = false;
  },
  tg: () => { if (S.tiktok >= 3000) { S.tgOn = true; S.tg = Math.round(S.tiktok * 0.05); log(`Telegram-канал запущен: ${fmt(S.tg)} подписчиков с первого дня.`, 'g'); } },
  residLater: () => { if (S.rep < 20 && S.money < 1200000) return; enterResid(); },
  course: v => {
    const cost = v === 'implant' ? 350000 : 500000; if (S.money < cost) return;
    S.money -= cost; S.courses[v] = true; S.skill = clamp(S.skill + 5, 0, 100); nextDay(3);
    log(v === 'implant' ? 'Курс имплантологии пройден. Открыты пациенты на импланты.' : 'Курс синус-лифтинга пройден. Открыты сложные случаи.', 'g');
  },
  clinic: () => {
    const req = clinicReq(), c = clinicCost();
    if (S.rep < req.rep || S.mentees < req.mentees || S.money < c) return;
    S.money -= c; S.clinics++;
    log(S.clinics === 1 ? `Открыта клиника «${S.name}». Мечта сбылась!` : `Открыт филиал №${S.clinics}.`, 'g');
  },
  mentor: () => { if (S.st.energy < 15) return; S.st.energy -= 15; S.mentees++; S.rep = clamp(S.rep + 2, 0, 100); nextDay(1); log(`Новый ученик в клинике. Всего учеников: ${S.mentees}.`); },
  tone: v => toneChoice(v),
  ask: v => ask(+v),
  toExam: () => { S.cs.step = 'exam'; },
  tooth: v => toothClick(+v),
  toImg: () => { S.cs.step = 'img'; },
  img: v => imgChoice(v),
  dx: v => { const c = cs(); S.cs.dx = +v; S.cs.chat.push({ w: 'd', t: 'Диагноз: ' + c.dx[+v] }); S.cs.step = 'plan'; },
  plan: v => { const c = cs(); S.cs.plan = +v; S.cs.chat.push({ w: 'd', t: 'План: ' + c.plan[+v] }); finishCase(); },
  caseDone: () => { S.cs = null; nextDay(1); S.scene = 'hub'; checkFinale(); },
  openSheet: () => { ui.sheet = true; },
  closeSheet: () => { ui.sheet = false; },
  buyCar: v => { if (S.money < CAR_PRICE || S.car) return; S.money -= CAR_PRICE; S.car = v; log(`${v === 'black' ? 'Чёрный' : 'Белый'} Mercedes-AMG GLS 63 у подъезда!`, 'g'); checkFinale(); },
  buyHouse: () => { if (S.money < HOUSE_PRICE || S.house) return; S.money -= HOUSE_PRICE; S.house = true; log('Двухэтажный дом у реки. Ключи у тебя.', 'g'); checkFinale(); },
  finaleGo: () => { S.scene = 'hub'; },
  reset: () => { ui.confirmReset = true; },
  resetNo: () => { ui.confirmReset = false; },
  resetYes: () => { ui.confirmReset = false; ui.sheet = false; ui.tripMenu = false; try { localStorage.removeItem(KEY); } catch (e) {} S = { scene: 'intro', log: [], st: { energy: 0 } }; }
};
function checkFinale() {
  if (S.finaleSeen) return;
  const D = dreams().filter(d => d.k !== 'budget');
  if (D.every(d => d.ok)) { S.finaleSeen = true; ui.sheet = false; S.scene = 'finale'; }
}
function act(el) {
  const fn = H[el.dataset.a];
  if (!fn) return;
  fn(el.dataset.v, el);
  if (S && S.scene !== 'intro') save();
  render();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  if (el.id === 'sheet') return;
  act(el);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui.sheet) { ui.sheet = false; render(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('g[data-a]')) { e.preventDefault(); act(e.target); }
  if (e.key === 'Enter' && e.target.id === 'nm') act({ dataset: { a: 'start' } });
});
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') { ui.sheet = false; render(); } });

function start(data) {
  S = (data && data.v) ? data : (load() || { scene: 'intro', log: [], st: { energy: 0 } });
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) { try { window.claude.hot.snapshot(() => S); } catch (e) {} }
  render();
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
</script>
</body>
</html>
